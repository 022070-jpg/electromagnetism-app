<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자기 유도 & 발전기·전동기 학습 인터랙션</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); line-height: 1.6; padding: 20px; max-width: 1000px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; }
        header h1 { font-size: 1.8rem; color: var(--accent-blue); margin-bottom: 8px; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-secondary); font-size: 1rem; font-weight: 600; padding: 10px 18px; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; }
        .tab-btn.active { background-color: var(--accent-blue); color: #0f172a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h2 { font-size: 1.3rem; margin-bottom: 15px; color: var(--accent-blue); }
        
        .sim-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        canvas { background-color: #020617; border: 1px solid var(--border-color); border-radius: 10px; width: 100%; max-width: 700px; height: auto; }
        
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; width: 100%; max-width: 700px; }
        .metric-box { background: #020617; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        .metric-box .label { font-size: 0.8rem; color: var(--text-secondary); }
